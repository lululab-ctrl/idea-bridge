<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Bridge</title>
<meta name="description" content="Capture every idea by voice. Understand, organize and act on them together.">
<meta name="theme-color" content="#14332b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idea Bridge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
/* Splash: shown instantly, before the app's code and styles arrive. */
html,body{margin:0;background:#14332b}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 80% at 50% 30%,#1d4a3e 0%,#14332b 60%);color:#e8efe9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;z-index:100;transition:opacity .25s ease}
.splash.gone{opacity:0;pointer-events:none}
.splash svg{width:96px;height:96px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.splash .arc{transform-origin:256px 300px;animation:ib-pulse 1.6s ease-in-out infinite}
.splash .arc2{animation-delay:.2s}
.splash .dot{animation:ib-pulse 1.6s ease-in-out infinite;animation-delay:.4s;transform-origin:256px 300px}
@keyframes ib-pulse{0%,100%{opacity:.35}50%{opacity:1}}
.splash .name{font-size:22px;font-weight:650;letter-spacing:-.01em}
.splash .bar{width:140px;height:3px;border-radius:3px;background:rgba(232,239,233,.15);overflow:hidden}
.splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:#f0b44c;animation:ib-slide 1.1s ease-in-out infinite}
@keyframes ib-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.splash .note{min-height:20px;font-size:14px;color:rgba(232,239,233,.7);text-align:center;padding:0 24px}
@media (prefers-reduced-motion:reduce){.splash .arc,.splash .dot,.splash .bar i{animation:none}.splash .bar i{width:100%;opacity:.6}}
</style>
<link rel="stylesheet" href="./css/app.css">
<script type="importmap">
{
  "imports": {
    "preact": "./vendor/preact.mjs",
    "preact/hooks": "./vendor/hooks.mjs",
    "htm": "./vendor/htm.mjs",
    "marked": "./vendor/marked.mjs",
    "dompurify": "./vendor/purify.mjs"
  }
}
</script>
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite">
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <rect width="512" height="512" rx="112" fill="#14332b"/>
    <g fill="none" stroke-linecap="round">
      <path class="arc" d="M136 300a120 120 0 0 1 240 0" stroke="#f0b44c" stroke-width="30"/>
      <path class="arc arc2" d="M186 300a70 70 0 0 1 140 0" stroke="#f0b44c" stroke-width="30"/>
      <circle class="dot" cx="256" cy="300" r="20" fill="#f0b44c"/>
      <path d="M112 360h288M152 404h208" stroke="#e8efe9" stroke-width="26"/>
    </g>
  </svg>
  <div class="name">Idea Bridge</div>
  <div class="bar"><i></i></div>
  <div class="note" id="splash-note">Loading…</div>
</div>
<div id="app"></div>
<script>
  // Friendly notes if starting takes a while.
  setTimeout(function () { var n = document.getElementById("splash-note"); if (n) n.textContent = "Connecting…"; }, 2500);
  setTimeout(function () { var n = document.getElementById("splash-note"); if (n) n.textContent = "Still connecting. Check your internet if this takes long."; }, 15000);
</script>
<noscript>Idea Bridge needs JavaScript turned on.</noscript>
<script src="./config.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
