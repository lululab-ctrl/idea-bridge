# Nightly backup of the database (the Supabase free plan has no automatic
# backups). Kept as a downloadable artifact for 30 days. Running every night
# also keeps the free project from pausing.
name: Nightly backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhfiboimwscurahprugu
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Back up every table
        run: deno run -A --node-modules-dir=none scripts/ops.ts backup idea-bridge-backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: idea-bridge-backup-${{ github.run_id }}
          path: idea-bridge-backup.json
          retention-days: 30
      - name: Keep the API awake
        run: curl -fsS "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/api/health" || true
