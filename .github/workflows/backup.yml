# Nightly database backup (the Supabase free plan has no automatic backups).
# The dump is kept as a GitHub artifact for 30 days. Running every night also
# keeps the free project from being paused for inactivity.
name: Nightly backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump the database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "$DB_URL" ]; then echo "::error::Missing GitHub secret SUPABASE_DB_URL"; exit 1; fi
          mkdir -p backup
          # Supabase runs Postgres 17; use the matching pg_dump.
          docker run --rm -v "$PWD/backup:/backup" postgres:17 \
            pg_dump "$DB_URL" --no-owner --no-privileges --schema=public --format=custom --file=/backup/idea-bridge.dump
          ls -lh backup
      - uses: actions/upload-artifact@v4
        with:
          name: idea-bridge-db-${{ github.run_id }}
          path: backup/idea-bridge.dump
          retention-days: 30
      - name: Keep the API awake
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api/health" || true
