# On every push to main: test, publish the web app to GitHub Pages, and deploy
# the database changes and the API to Supabase (free plan).
# The only secret needed is SUPABASE_ACCESS_TOKEN. The AI keys are added in the
# app (Settings → AI keys).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  PROJECT_REF: mhfiboimwscurahprugu
  APP_URL: https://lululab-ctrl.github.io/idea-bridge
  # The project is on a paid Supabase plan (100 GB of files included). On the
  # free plan (1 GB) set this to 900.
  STORAGE_LIMIT_MB: 90000

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["54329:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check and end-to-end tests
        working-directory: supabase/functions/api
        run: |
          deno task check
          deno task test

  web:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          npm ci
          IDEA_BRIDGE_API_URL="https://$PROJECT_REF.supabase.co/functions/v1" npm run build:web
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: Publish web app

  api:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhfiboimwscurahprugu
    steps:
      - name: Check for the Supabase token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (see README, step 1)."
          exit 1
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply database changes
        run: deno run -A --node-modules-dir=none scripts/ops.ts migrate
      - name: Set server settings
        run: deno run -A --node-modules-dir=none scripts/ops.ts secrets "APP_URL=$APP_URL" "STORAGE_LIMIT_MB=$STORAGE_LIMIT_MB"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the API
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Check the API is up (this also starts the background worker)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$PROJECT_REF.supabase.co/functions/v1/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1
